# ── Agent Roles ────────────────────────────────────────
# Roles are auto-configured with sensible defaults.
# Only override what you need — do NOT set empty values here
# as YAML will replace the entire role config.
#
# Six roles ship by default: developer, sre, qa, pm, frontend, generalist.
# generalist is the classifier fallback for ambiguous / research / explanation
# tasks — it does NOT inherit Developer's "no code in response text" rule.
#
# roles:
#   developer:
#     preferred_provider: "ollama"
#     max_iterations: 15
#   generalist:
#     preferred_provider: "ollama"
#     max_iterations: 10

# ── Agent Execution Pipeline ──────────────────────────
# Two execution paths are supported:
#
#   1. Orchestrator-Worker (DEFAULT, recommended): Planner → Dispatcher →
#      Workers → Synthesizer. Each LLM call has ONE job, which a 14B model
#      handles reliably. Put Go in charge of control flow; let the model
#      focus on decompose / execute-one-step / synthesize.
#
#   2. Thinking state machine (LEGACY): Assess → Plan → Execute → Verify →
#      Reflect → Done with a JSON scratchpad. Kept as opt-in for advanced
#      users who tuned it; NOT the default — it exhausts its budget on
#      multi-step tasks because one call must simultaneously understand,
#      plan, emit JSON, pick tools, verify, and reflect.
#
# Only ONE of orchestration.enabled / thinking.enabled should be true. If
# both are true, orchestration wins (it is checked first in Execute()).
#
# Env overrides:
#   KYOCI_ORCHESTRATION_ENABLED, KYOCI_ORCHESTRATION_MAX_STEPS,
#   KYOCI_ORCHESTRATION_MAX_PARALLEL,
#   KYOCI_ORCHESTRATION_WORKER_MAX_ITERATIONS,
#   KYOCI_ORCHESTRATION_WORKER_MAX_TOOL_CALLS
#   KYOCI_THINKING_ENABLED, KYOCI_THINKING_TOOL_BUDGET,
#   KYOCI_THINKING_MAX_REFLECTIONS, KYOCI_THINKING_MAX_REPLANS,
#   KYOCI_THINKING_CONFIDENCE_THRESHOLD, KYOCI_THINKING_FEW_SHOT
agent:
    orchestration:
        enabled: true # DEFAULT pipeline — one-job-per-call
        max_steps: 6 # planner output cap; over-this = over-decomposed
        max_parallel: 3 # concurrent worker goroutines
        worker_max_iterations: 8 # per-worker ReAct iteration cap
        worker_max_tool_calls: 8 # per-worker tool budget
        max_retries: 2 # pre-HITL retries on VERIFY: failure (L4 benchmark)
    thinking:
        enabled: false # legacy JSON-scratchpad mode; opt-in only
        tool_budget: 25 # max tool calls per task before forced Reflect/terminate
        max_reflections: 3 # hard cap on Reflect visits per task
        max_replans: 2 # hard cap on replanning from Reflect
        confidence_threshold: 0.7 # min Assess confidence for fast-path (skip Plan)
        few_shot: true # prepend worked JSON example to system prompt
# ── Human-In-The-Loop (HITL) ──────────────────────────
# When the orchestrator exhausts max_retries on a task carrying a VERIFY:
# directive, it emits a HelpRequest via gRPC. Operator clients (cmd/hitlctl)
# subscribe to this stream and reply with hints. Hints are injected into the
# agent's next attempt; on success, a permanent "lesson" is recorded to L3
# SQLite so future sessions benefit.
#
# Disable for production runs that don't need operator fallback.
hitl:
    enabled: true
    port: 50052
    request_timeout: 300  # seconds to wait for an operator hint (5 min)

# ── Prompt Skills ─────────────────────────────────────
# Markdown knowledge bundles (Hermes-style) loaded from `dir` at startup.
# Skills matching a task are injected into the system prompt to guide the
# agent through workflows using tools it already has (terminal, file, http).
# Add skills by dropping *.md files under data/skills/<category>/.
# Overrides: KYOCI_PROMPT_SKILLS_ENABLED, KYOCI_PROMPT_SKILLS_DIR,
#   KYOCI_PROMPT_SKILLS_MAX_PER_TASK, KYOCI_PROMPT_SKILLS_MAX_CHARS
prompt_skills:
    enabled: true
    dir: "data/skills"
    max_skills_per_task: 4 # cap matched skills per task (prompt size guard)
    max_total_chars: 4000 # cap total injected body bytes per task — kept small
    # because the thinking path's JSON protocol (~2.3k
    # chars) must stay the strongest signal before the
    # task for 8B-class models. Larger budgets dilute it
    # and trigger reflection-loop exhaustion.
