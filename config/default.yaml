# API keys can also be set via environment variables:
#   KYOCI_PROVIDER_{NAME}_API_KEY=your-key
providers:
    ollama:
        enabled: false
        base_url: "http://127.0.0.1:1234"
        default_model: "google/gemma-4-e4b"
        timeout: 300
        max_retries: 5
    lmstudio:
        enabled: true
        base_url: "http://127.0.0.1:1234/v1"
        default_model: "google/gemma-4-e4b"
        timeout: 300
        max_retries: 2
    openai:
        enabled: false
        base_url: "https://api.openai.com/v1"
        default_model: "gpt-4o"
        timeout: 120
        max_retries: 3
    anthropic:
        enabled: false # flip to true + paste api_key when ready
        base_url: "https://api.z.ai/api/anthropic"
        default_model: "GLM-4.7"
        timeout: 1000
        max_retries: 3
        api_key: "" # paste your z.ai / Anthropic key here (never commit real keys)
    gemini:
        enabled: false
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        default_model: "gemini-2.5-pro-preview-05-21"
        timeout: 120
        max_retries: 3
    zai:
        enabled: false
        base_url: "https://open.bigmodel.cn/api/paas/v4"
        default_model: "glm-4.7"
        timeout: 120
        max_retries: 3
    groq:
