telegram:
    enabled: true
    token: ""
    allowed_users: ""
    poll_timeout: 30
mcp:
    servers:
        context7:
            command: npx
            args:
                - -y
                - '@upstash/context7-mcp'
            env: {}
            enabled: true
        fetch:
            command: npx
            args:
                - -y
                - '@modelcontextprotocol/server-fetch'
            env: {}
            enabled: true
        filesystem:
            command: npx
            args:
                - -y
                - '@modelcontextprotocol/server-filesystem'
                - .
            env: {}
            enabled: true
webhook:
    enabled: true
    secret: ""
agent:
    thinking:
        enabled: false
        tool_budget: 25
        max_reflections: 3
        max_replans: 2
        confidence_threshold: 0.7
        few_shot: true
    orchestration:
        enabled: true
        max_steps: 60
        max_parallel: 1
        worker_max_iterations: 8
        worker_max_tool_calls: 8
        max_retries: 2
        model_routing:
            planner:
                provider: anthropic
                model: glm-5.2
            worker:
                provider: lmstudio
                model: qwen/qwen3.5-9b
            worker_file_creation:
                provider: anthropic
                model: glm-4.7
            synthesizer:
                provider: anthropic
                model: glm-4.7
            qa:
                provider: anthropic
                model: glm-5.2
prompt_skills:
    enabled: true
    dir: data/skills
    max_skills_per_task: 4
    max_total_chars: 4000
routing:
    cache_enabled: true
    cache_max_entries: 1024
    log_provenance: true
hitl:
    enabled: true
    port: 50052
    request_timeout: 300
tasks:
    dir: tasks
    retention_days: 30
agents_dir: agents
