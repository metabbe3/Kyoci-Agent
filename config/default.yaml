# Kyoci Agent v5 — Default Configuration

server:
    grpc_port: 50051
    rest_port: 8080
    tls_enabled: false
    tls_cert: ""
    tls_key: ""
logging:
    level: "info"
    format: "json"
    # Per-run agent execution traces. When true, every orchestrated agent run
    # also writes a JSON-lines trace to <per_run_dir>/<YYYY-MM-DD>/run_<task_id>.log
    # alongside stdout. These are job artifacts, NOT server logs — server runtime
    # logs still go to stdout only (12-factor). Disable for hermetic test runs.
    # Env: KYOCI_LOGGING_PER_RUN_ENABLED, KYOCI_LOGGING_PER_RUN_DIR
    per_run_enabled: true
    per_run_dir: "logs"
# Per-task workspace configuration. Each orchestrated agent run that produces
# user-facing files writes them under <dir>/<task_id>/. Tasks that write nothing
# leave no folder behind. Existing projects/ content is unchanged.
# Env: KYOCI_TASKS_DIR, KYOCI_TASKS_RETENTION_DAYS
tasks:
    dir: "tasks"
    retention_days: 30  # informational — no auto-deletion; external scripts read this
# Agents directory — markdown-driven agent definitions. The orchestrator walks
# this dir at startup and registers each .md file as an agent. Each file has
# YAML frontmatter (name, description, triggers, tools, memory, priority) and
# a markdown body that becomes the agent's system prompt ("soul").
# Add a new agent by dropping another .md file here — no Go code required.
# Env: KYOCI_AGENTS_DIR
agents_dir: "agents"
memory:
    db_path: "data/kyoci.db"
    compaction_threshold: 0.75
    max_shortterm_tokens: 4000
pool:
    workers: 4
    queue_size: 100
security:
    auth_enabled: false
    rate_limit: 100
    tls_enabled: false
# ── Telegram Gateway ───────────────────────────────────
# NEVER commit a real bot token. Set it via env var KYOCI_TELEGRAM_TOKEN
# or paste it into this field locally and keep this file out of git if you
# must commit a different change.
telegram:
    enabled: true
    token: ""
    allowed_users: ""
    poll_timeout: 30
# ── Webhook Gateway ────────────────────────────────────
# External apps can POST to /api/v1/webhook to trigger tasks
webhook:
    enabled: true
    secret: ""
# ── MCP (Model Context Protocol) ───────────────────────
# Connect external MCP servers — their tools become native Kyoci tools
# mcp:
#   servers:
#     filesystem:
#       enabled: true
#       command: "npx"
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#     github:
#       enabled: true
#       command: "npx"
#       args: ["-y", "@modelcontextprotocol/server-github"]
#       env:
#         GITHUB_TOKEN: "ghp_xxx"
mcp:
    servers: {}
# ── LLM Providers ──────────────────────────────────────
