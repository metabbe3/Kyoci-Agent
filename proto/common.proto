syntax = "proto3";

package kyoci.v5;

option go_package = "github.com/metabbe3/Kyoci-Agent/proto;kyociv5";

// MessageRole represents the role of a message sender in a conversation
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_TOOL = 4;
}

// Message represents a single message in a conversation
message Message {
  MessageRole role = 1;
  string content = 2;
  string name = 3;
  string tool_call_id = 4;
  repeated ToolCall tool_calls = 5;
}

// ToolCall represents a function/tool invocation
message ToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3; // JSON string
}

// TokenUsage tracks token consumption for API calls
message TokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

// Metadata is a generic key-value map for additional context
message Metadata {
  map<string, string> data = 1;
}

// Empty message for requests with no parameters
message Empty {}