syntax = "proto3";
package agent;
option go_package = "github.com/nicholas/ai-agent/grpc/proto";

service AgentService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc StreamChat(ChatRequest) returns (stream ChatResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message ChatRequest {
  string message = 1;
  string provider = 2;
  string session_id = 3;
}

message ChatResponse {
  string message = 1;
  string model = 2;
  int32 tier = 3;
  int64 tokens = 4;
  string session_id = 5;
}

message StatusRequest {}

message StatusResponse {
  string status = 1;
  string version = 2;
  int32 providers = 3;
  int32 tools = 4;
}