syntax = "proto3";

package kyoci.agent.v1;

option go_package = "github.com/metabbe3/Kyoci-Agent/internal/agentpb;agentpb";

// AgentService exposes the orchestrator's task execution, streaming, and
// status operations over gRPC. It is the network counterpart to the HTTP
// /api/v1/execute and /api/v1/status endpoints — opt-in (default OFF) so the
// shipping benchmark suite is unaffected.
//
// This proto is intentionally self-contained (no cross-file imports, no
// google.protobuf.Empty) to keep the generated package free of well-known-type
// dependencies and to avoid the legacy uncompiled protos in this directory.
service AgentService {
  // Execute runs a task through the role-routing pipeline and returns the
  // final result. role="" means auto-detect the best role from the prompt.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // ExecuteStream runs a task and streams partial chunks back until done.
  rpc ExecuteStream(ExecuteRequest) returns (stream StreamChunk);

  // GetStatus returns the current agent status (version, uptime, roles,
  // providers, memory usage). Takes an empty request message.
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// ExecuteRequest is the request body for Execute and ExecuteStream.
message ExecuteRequest {
  // prompt is the task to execute. Required.
  string prompt = 1;
  // role is the role name (e.g. "developer", "sre", "qa", "pm", "frontend").
  // Empty means auto-detect the best role from the prompt.
  string role = 2;
  // timeout_seconds bounds the execution. <=0 uses the server default.
  int32 timeout_seconds = 3;
}

// ExecuteResponse is the result of a synchronous Execute call.
message ExecuteResponse {
  // result is the final assistant content.
  string result = 1;
  // role is the role that actually ran (may differ when auto-detected).
  string role = 2;
  // iterations is the number of reasoning/execution iterations.
  int32 iterations = 3;
  // tool_calls is the number of tool calls made.
  int32 tool_calls = 4;
  // usage records token consumption, when available.
  TokenUsage usage = 5;
  // error is a non-empty error message when execution failed. The gRPC status
  // code is also set; this field is the human-readable detail.
  string error = 6;
  // duration_ms is the wall-clock execution time.
  int64 duration_ms = 7;
}

// StreamChunk is one piece of a streamed execution. The stream terminates with
// a chunk whose done=true (success) or with a gRPC error (failure).
message StreamChunk {
  // partial is the content delta.
  string partial = 1;
  // done marks the terminal chunk of the stream.
  bool done = 2;
  // usage is populated on the terminal chunk, when available.
  TokenUsage usage = 3;
}

// StatusRequest is an empty request for GetStatus.
message StatusRequest {}

// StatusResponse describes the current agent status.
message StatusResponse {
  // version is the build version reported by the server.
  string version = 1;
  // uptime_seconds is how long the server has been running.
  int64 uptime_seconds = 2;
  // active_roles lists the role names available in the registry.
  repeated string active_roles = 3;
  // providers lists the configured LLM provider names.
  repeated string providers = 4;
  // started is true once the orchestrator has been started.
  bool started = 5;
  // memory_entries is the total number of stored memory entries.
  int32 memory_entries = 6;
}

// TokenUsage tracks token consumption for an execution.
message TokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}
