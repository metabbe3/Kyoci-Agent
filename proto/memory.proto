syntax = "proto3";

package kyoci.v5;

option go_package = "github.com/metabbe3/Kyoci-Agent/proto;kyociv5";

import "common.proto";

// MemoryType categorizes memory storage types
enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  MEMORY_TYPE_SHORT_TERM = 1;
  MEMORY_TYPE_LONG_TERM = 2;
  MEMORY_TYPE_SKILL = 3;
}

// MemoryEntry represents a stored memory item
message MemoryEntry {
  string id = 1;
  string content = 2;
  MemoryType type = 3;
  Metadata metadata = 4;
  google.protobuf.Timestamp created_at = 5;
  float relevance_score = 6;
}

// StoreRequest represents a request to store a memory
message StoreRequest {
  string content = 1;
  MemoryType type = 2;
  Metadata metadata = 3;
}

// StoreResponse returns the ID of the stored memory
message StoreResponse {
  string id = 1;
}

// RecallRequest represents a request to retrieve memories
message RecallRequest {
  string query = 1;
  int32 limit = 2;
  MemoryType memory_type = 3;
}

// RecallResponse returns matching memory entries
message RecallResponse {
  repeated MemoryEntry entries = 1;
}

// CompactRequest represents a request to compact memory
message CompactRequest {
  int32 max_tokens = 1;
}