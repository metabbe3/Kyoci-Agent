syntax = "proto3";

package kyoci.v5;

option go_package = "github.com/metabbe3/Kyoci-Agent/proto;kyociv5";

import "common.proto";

// ToolType categorizes the source of tool definitions
enum ToolType {
  TOOL_TYPE_UNSPECIFIED = 0;
  TOOL_TYPE_BUILTIN = 1;
  TOOL_TYPE_MCP = 2;
  TOOL_TYPE_CUSTOM = 3;
}

// ToolParameter defines a parameter for a tool
message ToolParameter {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
  repeated string enum_values = 5;
}

// ToolDefinition describes a tool's interface
message ToolDefinition {
  string name = 1;
  string description = 2;
  repeated ToolParameter parameters = 3;
  ToolType tool_type = 4;
}

// ToolCallRequest represents a request to execute a tool
message ToolCallRequest {
  string tool_name = 1;
  string arguments = 2; // JSON string
  Metadata context = 3;
}

// ToolCallResponse represents the result of a tool execution
message ToolCallResponse {
  string result = 1;
  string error = 2;
  bool success = 3;
}