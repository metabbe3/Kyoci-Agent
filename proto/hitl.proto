syntax = "proto3";

package kyoci.hitl.v1;

option go_package = "github.com/metabbe3/Kyoci-Agent/internal/hitl/pb;hitlpb";

// HITLService streams HelpRequests from agents to a human operator and
// accepts HintSubmissions back. Used by the Level 4 benchmark's self-healing
// pipeline: when the orchestrator exhausts its retry budget, it emits a
// HelpRequest and blocks until the operator supplies a hint.
service HITLService {
  // SubscribeHelpRequests opens a server-streaming RPC. The server pushes every
  // new HelpRequest to the subscriber until the client disconnects. Only one
  // subscriber at a time is typical (one operator terminal).
  rpc SubscribeHelpRequests(SubscribeRequest) returns (stream HelpRequest);

  // SubmitHint delivers an operator's hint to the waiting agent goroutine.
  // Returns accepted=true if a waiter was found and notified; accepted=false
  // (with NotFound in the status) if no agent is currently waiting on task_id.
  rpc SubmitHint(HintSubmission) returns (HintResponse);
}

// SubscribeRequest is empty — the subscription is unfiltered. Future work may
// add filters (role, task_id pattern) but the L4 benchmark needs none.
message SubscribeRequest {}

// HelpRequest is emitted by an agent that has exhausted its retry budget.
// The operator reads this on stdin (interactive mode) or just records it
// (automated mode) and responds via SubmitHint.
message HelpRequest {
  string task_id = 1;
  string role = 2;
  int32 attempt = 3;
  string question = 4;
  string last_error = 5;
  repeated string attempted_fixes = 6;
  int64 emitted_at_unix = 7;
}

// HintSubmission carries the operator's hint back to the waiting agent.
message HintSubmission {
  string task_id = 1;
  string hint = 2;
}

// HintResponse acknowledges the submission.
message HintResponse {
  bool accepted = 1;
}
