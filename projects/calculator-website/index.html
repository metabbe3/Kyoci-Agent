<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

    <div class="calculator">
        <!-- Display Area -->
        <div class="display">
            <div id="current-operation">0</div>
            <div id="result">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="buttons">
            <!-- Row 1: Clear, Operators -->
            <button class="btn clear" data-action="clear">AC</button>
            <button class="btn operator" data-action="backspace">DEL</button>
            <button class="btn operator" data-action="percentage">%</button>
            <button class="btn operator" data-action="divide">/</button>

            <!-- Row 2: Numbers and Operators -->
            <button class="btn number" data-action="number">7</button>
            <button class="btn number" data-action="number">8</button>
            <button class="btn number" data-action="number">9</button>
            <button class="btn operator" data-action="multiply">*</button>

            <!-- Row 3: Numbers and Operators -->
            <button class="btn number" data-action="number">4</button>
            <button class="btn number" data-action="number">5</button>
            <button class="btn number" data-action="number">6</button>
            <button class="btn operator" data-action="subtract">-</button>

            <!-- Row 4: Numbers and Operators -->
            <button class="btn number" data-action="number">1</button>
            <button class="btn number" data-action="number">2</button>
            <button class="btn number" data-action="number">3</button>
            <button class="btn operator" data-action="add">+</button>

            <!-- Row 5: Numbers and Equals -->
            <button class="btn number" data-action="number">0</button>
            <button class="btn number" data-action="decimal">.</button>
            <button class="btn equals" data-action="calculate">=</button>
        </div>
    </div>

    <script src="./calculator.js"></script>
</body>
</html>
