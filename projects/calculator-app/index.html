<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator-container">
    <header class="calculator-header">
      <h1>🧮 Calculator</h1>
      <div class="mode-toggle">
        <button id="toggle-mode" class="mode-btn">🌙 Dark Mode</button>
      </div>
    </header>
    
    <div class="calculator-body">
      <div class="display-container">
        <div class="display-history" id="history"></div>
        <div class="display-main">
          <input type="text" id="display" class="display-input" value="0" readonly>
        </div>
      </div>
      
      <div class="keypad">
        <div class="keypad-row">
          <button class="key btn-ac" data-action="AC">AC</button>
          <button class="key btn-del" data-action="DEL">DEL</button>
          <button class="key btn-percent" data-action="%">%</button>
          <button class="key btn-ops" data-action="÷">÷</button>
        </div>
        <div class="keypad-row">
          <button class="key btn-num" data-value="7">7</button>
          <button class="key btn-num" data-value="8">8</button>
          <button class="key btn-num" data-value="9">9</button>
          <button class="key btn-ops" data-action="×">×</button>
        </div>
        <div class="keypad-row">
          <button class="key btn-num" data-value="4">4</button>
          <button class="key btn-num" data-value="5">5</button>
          <button class="key btn-num" data-value="6">6</button>
          <button class="key btn-ops" data-action="-">-</button>
        </div>
        <div class="keypad-row">
          <button class="key btn-num" data-value="1">1</button>
          <button class="key btn-num" data-value="2">2</button>
          <button class="key btn-num" data-value="3">3</button>
          <button class="key btn-ops" data-action="+">+</button>
        </div>
        <div class="keypad-row">
          <button class="key btn-zero" data-value="0">0</button>
          <button class="key btn-zero" data-value="00">00</button>
          <button class="key btn-dot" data-value=".">.</button>
          <button class="key btn-equals" data-action="=">=</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
