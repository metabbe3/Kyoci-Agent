<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 60px;
            padding: 10px;
            font-size: 2.5em;
            text-align: right;
            border: none;
            background-color: #222;
            color: white;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #555;
            color: white;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #777;
        }

        .operator {
            background-color: #ff9500;
        }

        .operator:hover {
            background-color: #e68a00;
        }

        .clear {
            background-color: #d9534f;
        }

        .clear:hover {
            background-color: #c9302c;
        }

        .equals {
            grid-column: span 1; /* Ensure equals button fits nicely */
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly value="0">
        <div class="buttons">
            <button class="clear" data-action="clear">C</button>
            <button class="operator" data-action="divide">/</button>
            <button class="operator" data-action="multiply">*</button>
            <button class="clear operator" data-action="backspace">DEL</button>

            <button data-number>7</button>
            <button data-number>8</button>
            <button data-number>9</button>
            <button class="operator" data-action="subtract">-</button>

            <button data-number>4</button>
            <button data-number>5</button>
            <button data-number>6</button>
            <button class="operator" data-action="add">+</button>

            <button data-number>1</button>
            <button data-number>2</button>
            <button data-number>3</button>
            <button class="equals" data-action="calculate">=</button>

            <button data-number>0</button>
            <button class="operator" data-action="decimal">.</button>
        </div>
    </div>
    <script src="script.js"></script>
</body></html>
