<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook Calculator</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="calculator-container">
        <!-- Display Screen -->
        <div class="display" id="display">0</div>

        <!-- Button Grid -->
        <div class="buttons-grid">
            <button class="btn operation" data-action="clear">AC</button>
            <button class="btn operation" data-action="sign">+/-</button>
            <button class="btn operation" data-action="percent">%</button>
            <button class="btn operator" data-action="divide">/</button>

            <!-- Row 7, 8, 9 -->
            <button class="btn number" data-number>7</button>
            <button class="btn number" data-number>8</button>
            <button class="btn number" data-number>9</button>
            <button class="btn operator" data-action="multiply">*</button>

            <!-- Row 4, 5, 6 -->
            <button class="btn number" data-number>4</button>
            <button class="btn number" data-number>5</button>
            <button class="btn number" data-number>6</button>
            <button class="btn operator" data-action="subtract">-</button>

            <!-- Row 1, 2, 3 -->
            <button class="btn number" data-number>1</button>
            <button class="btn number" data-number>2</button>
            <button class="btn number" data-number>3</button>
            <button class="btn operator" data-action="add">+</button>

            <!-- Bottom Row -->
            <button class="btn number zero" data-number>0</button>
            <button class="btn number" data-action="decimal">.</button>
            <button class="btn equals" data-action="calculate">=</button>
        </div>
    </div>

    <script src="./calculator.js"></script>
</body>
</html>
